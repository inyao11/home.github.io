<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YINYAO Home</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow-x: hidden;
      position: relative;
      
      background-image: url('https://picsum.photos/1920/1080?random=' + new Date().getTime());
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      transition: background-image 0.5s ease;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.55);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 700px;
      width: 90%;
      padding: 2rem 1rem;
      opacity: 0;
      animation: fadeIn 1.2s ease forwards 0.3s;
    }

    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 1.5rem;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.4s ease;
    }

    .avatar:hover {
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.7);
    }

    .name {
      font-size: 2.8rem;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }

    .slogan {
      font-size: 1.1rem;
      color: #e2e8f0;
      margin-bottom: 1rem;
      font-weight: 300;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .divider {
      width: 60px;
      height: 2px;
      background: rgba(255, 255, 255, 0.4);
      margin: 1.2rem auto;
      border-radius: 1px;
    }

    .quote {
      font-size: 1rem;
      color: #e2e8f0;
      line-height: 1.7;
      margin-bottom: 2.5rem;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
      min-height: 50px;
    }

    .quote strong {
      color: #fff;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 2.2rem;
    }

    .nav-links a {
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-links a:hover {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(-2px);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 3rem;
    }

    .social-links a {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.3rem;
      transition: all 0.3s ease;
    }

    .social-links a:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.1);
    }

    .footer {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.7);
    }

    .footer a {
      color: rgba(255,255,255,0.9);
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .name { font-size: 2.2rem; }
      .avatar-wrap { width: 150px; height: 150px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="avatar-wrap">
      <img src="https://raw.githubusercontent.com/inyao11/home.github.io/gh-pages/yy.png" alt="YINYAO" class="avatar">
    </div>

    <h1 class="name">YINYAO</h1>
    <p class="slogan">Code Create Life</p>

    <div class="divider"></div>

    <!-- 诗句区域：会自动随机更新 -->
    <p class="quote" id="quote">
      如何得与凉风约, 不共尘沙一并来!<br>
      <strong>-「中牟道中」</strong>
    </p>

    <div class="nav-links">
      <a href="https://weibo.com/u/5275318888?tabtype=feed" target="_blank">微博</a>
      <a href="https://blog.csdn.net/yin_yao?type=blog" target="_blank">博客</a>
      <a href="https://baike.baidu.com/item/%E5%BD%AD%E4%BA%8E%E6%99%8F/305410" target="_blank">简历</a>
      <a href="https://note.youdao.com/web/#/file/recent/note/WEB04e9fb910b16f0f842951673cf26b431/" target="_blank">笔记</a>
      <a href="https://excalidraw.com/" target="_blank">画画</a>
    </div>

    <div class="social-links">
      <a href="https://github.com/inyao11" target="_blank"><i class="fa fa-github"></i></a>
      <a href="https://www.zhihu.com/" target="_blank"><i class="fa fa-globe"></i></a>
    </div>

    <div class="footer">
      <p>Powered By <a href="https://github.com/features/actions">GitHub Actions</a> And <a href="https://hitokoto.cn/">Hitokoto</a></p>
    </div>
  </div>

  <script>
    // 1. 自动换壁纸
    document.body.style.backgroundImage = `url('https://picsum.photos/1920/1080?random=${Date.now()}')`;

    // 2. 🔥 智能随机诗句（每次打开自动更新）
    const poems = [
      { text: "如何得与凉风约, 不共尘沙一并来!", author: "「中牟道中」" },
      { text: "行到水穷处, 坐看云起时。", author: "「终南别业」" },
      { text: "醉后不知天在水, 满船清梦压星河。", author: "「题龙阳县青草湖」" },
      { text: "桃李春风一杯酒, 江湖夜雨十年灯。", author: "「寄黄几复」" },
      { text: "小舟从此逝, 江海寄余生。", author: "「临江仙」" },
      { text: "明月几时有, 把酒问青天。", author: "「水调歌头」" },
      { text: "人生如逆旅, 我亦是行人。", author: "「临江仙」" },
      { text: "愿我如星君如月, 夜夜流光相皎洁。", author: "「车遥遥篇」" },
      { text: "众里寻他千百度, 蓦然回首, 那人却在, 灯火阑珊处。", author: "「青玉案·元夕」" },
      { text: "长风破浪会有时, 直挂云帆济沧海。", author: "「行路难」" }
    ];

    function randomPoem() {
      const random = poems[Math.floor(Math.random() * poems.length)];
      document.getElementById("quote").innerHTML = `
        ${random.text}<br>
        <strong>- ${random.author}</strong>
      `;
    }

    // 页面加载时自动更新诗句
    window.onload = randomPoem;
  </script>
</body>
</html>
